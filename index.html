<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Interactive To-Do List with CRUD operations, filtering and local storage."
    >

    <title>My To-Do List</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <header class="header">
        <div class="container">
            <h1>My To-Do List</h1>
            <p>Organize your tasks and stay productive.</p>
        </div>
    </header>


    <main class="container">

        <!-- Add Task -->
        <section class="task-input-section" aria-labelledby="add-task-title">

            <h2 id="add-task-title">Add a New Task</h2>

            <form id="task-form">

                <label for="task-input">
                    Task
                </label>

                <div class="input-group">

                    <input
                        type="text"
                        id="task-input"
                        placeholder="Enter your task..."
                        autocomplete="off"
                        required
                    >

                    <button type="submit" id="add-task-btn">
                        Add Task
                    </button>

                </div>

            </form>

        </section>


        <!-- Filters -->
        <section class="filter-section" aria-labelledby="filter-title">

            <h2 id="filter-title">Filter Tasks</h2>

            <div class="filters">

                <button
                    type="button"
                    class="filter-btn active"
                    data-filter="all"
                >
                    All
                </button>

                <button
                    type="button"
                    class="filter-btn"
                    data-filter="active"
                >
                    Active
                </button>

                <button
                    type="button"
                    class="filter-btn"
                    data-filter="completed"
                >
                    Completed
                </button>

            </div>

        </section>


        <!-- Tasks -->
        <section class="tasks-section" aria-labelledby="tasks-title">

            <div class="tasks-header">

                <h2 id="tasks-title">
                    My Tasks
                </h2>

                <span id="task-count">
                    0 tasks
                </span>

            </div>

            <ul
                id="task-list"
                class="task-list"
                aria-live="polite"
            ></ul>

            <p
                id="empty-message"
                class="empty-message"
            >
                No tasks yet. Add your first task!
            </p>

        </section>

    </main>


    <footer class="footer">

        <p>
            &copy; 2026 My To-Do List
        </p>

    </footer>

        
    <script src="./js/script.js"></script>

</body>
</html>
